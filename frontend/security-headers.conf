# Security headers, kept in one file because of an nginx trap: `add_header` is
# inherited by a child block ONLY if that block declares no `add_header` of its
# own. A single `add_header Cache-Control ...` inside a location silently drops
# every inherited security header. So this file is included explicitly in the
# server block AND in every location that sets a header of its own.

# The SPA is entirely self-hosted, so the policy can be strict. 'unsafe-inline'
# is allowed for styles only, because the bundler inlines a small critical
# block; scripts get no such allowance. img-src permits https: for the
# placeholder product photography.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
