{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "web-store.serviceAccountName" . }}
  labels:
    {{- include "web-store.labels" . | nindent 4 }}
  {{- if .Values.serviceAccount.roleArn }}
  annotations:
    # IRSA: lets the Secrets Store CSI driver read this workload's secrets
    # without any long-lived AWS credential in the cluster.
    eks.amazonaws.com/role-arn: {{ .Values.serviceAccount.roleArn | quote }}
  {{- end }}
automountServiceAccountToken: true
{{- end }}
