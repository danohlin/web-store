{{- if .Values.secrets.enabled }}
{{- if not .Values.secrets.databaseSecretName }}
{{- fail "secrets.databaseSecretName is required when secrets.enabled is true" }}
{{- end }}
{{- if not .Values.secrets.appSecretName }}
{{- fail "secrets.appSecretName is required when secrets.enabled is true" }}
{{- end }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "web-store.secretProviderClassName" . }}
  labels:
    {{- include "web-store.labels" . | nindent 4 }}
spec:
  provider: aws
  parameters:
    region: {{ .Values.secrets.region | quote }}
    # Each jmesPath entry becomes its own file named after objectAlias, which is
    # exactly what the backend's file-based config resolution expects.
    #
    # Nothing is synced to a Kubernetes Secret: the values stay on a tmpfs
    # mount, so they never reach etcd and never appear in `kubectl get secret`.
    objects: |
      - objectName: {{ .Values.secrets.databaseSecretName | quote }}
        objectType: secretsmanager
        jmesPath:
          - path: username
            objectAlias: DB_USER
          - path: password
            objectAlias: DB_PASSWORD
          - path: host
            objectAlias: DB_HOST
          # RDS writes the port as a JSON number, and the provider only accepts
          # strings, so it has to be converted here.
          - path: to_string(port)
            objectAlias: DB_PORT
          - path: dbname
            objectAlias: DB_NAME
      - objectName: {{ .Values.secrets.appSecretName | quote }}
        objectType: secretsmanager
        jmesPath:
          - path: jwtAccessSecret
            objectAlias: JWT_ACCESS_SECRET
          - path: jwtRefreshSecret
            objectAlias: JWT_REFRESH_SECRET
          - path: seedAdminPassword
            objectAlias: SEED_ADMIN_PASSWORD
          - path: seedCustomerPassword
            objectAlias: SEED_CUSTOMER_PASSWORD
{{- end }}
