apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "web-store.fullname" . }}-backend
  labels:
    {{- include "web-store.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  {{- if not .Values.backend.autoscaling.enabled }}
  replicas: {{ .Values.backend.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "web-store.selectorLabels" (dict "root" . "component" "backend") | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        {{- include "web-store.labels" . | nindent 8 }}
        app.kubernetes.io/component: backend
      annotations:
        # Rolls the pods when non-secret configuration changes. Secret values
        # deliberately do not appear here — hashing them would leak them into
        # the pod spec.
        checksum/config: {{ toYaml .Values.app | sha256sum }}
    spec:
      serviceAccountName: {{ include "web-store.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if eq .Values.podAntiAffinity "preferred" }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    {{- include "web-store.selectorLabels" (dict "root" . "component" "backend") | nindent 20 }}
      {{- end }}
      # Long enough for in-flight requests to drain; server.ts closes the HTTP
      # server on SIGTERM and forces exit after 15s.
      terminationGracePeriodSeconds: 30
      containers:
        - name: backend
          image: {{ include "web-store.image" .Values.backend.image }}
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']
          ports:
            - name: http
              containerPort: 4000
              protocol: TCP
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: '4000'
            - name: LOG_LEVEL
              value: {{ .Values.app.logLevel | quote }}
            - name: TRUST_PROXY
              value: {{ .Values.app.trustProxy | quote }}
            - name: COOKIE_SECURE
              value: {{ .Values.app.cookieSecure | quote }}
            - name: CORS_ORIGINS
              value: {{ .Values.app.corsOrigins | quote }}
            - name: SHIPPING_FLAT_CENTS
              value: {{ .Values.app.shippingFlatCents | quote }}
            - name: FREE_SHIPPING_THRESHOLD_CENTS
              value: {{ .Values.app.freeShippingThresholdCents | quote }}
            - name: TAX_RATE_BASIS_POINTS
              value: {{ .Values.app.taxRateBasisPoints | quote }}
            {{- if .Values.secrets.enabled }}
            # Points the config loader at the CSI mount. Credentials themselves
            # are never environment variables.
            - name: SECRETS_DIR
              value: {{ .Values.secrets.mountPath | quote }}
            {{- end }}
          # Liveness must not touch the database: a brief RDS blip would
          # otherwise have Kubernetes kill every healthy pod.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          # Readiness does check the database, so a pod that cannot serve is
          # pulled from the Service without being restarted.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 24
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          volumeMounts:
            {{- if .Values.secrets.enabled }}
            - name: secrets
              mountPath: {{ .Values.secrets.mountPath }}
              readOnly: true
            {{- end }}
            # The root filesystem is read-only, so anything that writes needs
            # an explicit emptyDir.
            - name: tmp
              mountPath: /tmp
      volumes:
        {{- if .Values.secrets.enabled }}
        - name: secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: {{ include "web-store.secretProviderClassName" . }}
        {{- end }}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "web-store.fullname" . }}-backend
  labels:
    {{- include "web-store.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  ports:
    - port: 4000
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "web-store.selectorLabels" (dict "root" . "component" "backend") | nindent 4 }}
{{- if .Values.backend.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "web-store.fullname" . }}-backend
  labels:
    {{- include "web-store.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "web-store.fullname" . }}-backend
  minReplicas: {{ .Values.backend.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.backend.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.backend.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
